# Production / EC2 overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set POSTGRES_PASSWORD in .env (letters+numbers only — no @ # / in password).

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports: []   # do not expose Postgres to the internet

  redis:
    ports: []   # Redis internal only

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:${POSTGRES_PASSWORD:-change_me}@postgres:5432/cryptobot
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  collector:
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:${POSTGRES_PASSWORD:-change_me}@postgres:5432/cryptobot
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  trader:
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:${POSTGRES_PASSWORD:-change_me}@postgres:5432/cryptobot
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_API_TOKEN: ${API_SECRET_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      - api
