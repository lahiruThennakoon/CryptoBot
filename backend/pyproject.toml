[project]
name = "cryptobot"
version = "0.2.0"
description = "Risk-first crypto trading platform — Binance Spot Testnet & paper trading only"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "aiosqlite>=0.20",
    "types-redis",
]

[project.scripts]
cryptobot = "cryptobot.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptobot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cryptobot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "testnet: real Binance Testnet integration tests (opt-in: pytest -m testnet)",
]
addopts = "-m 'not testnet'"

[tool.coverage.run]
source = ["src/cryptobot"]
