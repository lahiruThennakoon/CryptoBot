services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: change_me   # dev only; override via env
      POSTGRES_DB: cryptobot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env            # never committed
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:change_me@postgres:5432/cryptobot
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn cryptobot.api.main:app --host 0.0.0.0 --port 8000

  collector:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:change_me@postgres:5432/cryptobot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: cryptobot collect

  trader:
    build: ./backend
    env_file: .env            # paper mode by default; live is structurally gated
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:change_me@postgres:5432/cryptobot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: cryptobot trade

  dashboard:
    build: ./dashboard
    ports: ["127.0.0.1:3000:3000"]   # localhost only — single-operator UI
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    env_file: .env
    depends_on: [api]

volumes:
  pgdata:
